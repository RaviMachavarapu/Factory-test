# python stack pack — composite toolchain action (REQ-303).
# Installs the gate dependencies and the security floor tools for a
# python-stack instance (REQ-330). The gates workflow's own Linux step
# installs the formal verifier (a python instance runs on Linux only).
name: "SpecFlow python toolchain"
description: "Set up Python and install the gate dependencies for a python-stack instance."
inputs:
  python_version:
    description: "Python version to set up"
    required: false
    default: "3.12"
runs:
  using: "composite"
  steps:
    - name: Cache the floor tool assets
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/specflow-tools
        key: ${{ runner.os }}-specflow-tools-${{ hashFiles('scripts/pinned-tools.yml') }}
    - name: Floor tools (gitleaks, osv-scanner)
      shell: bash
      run: |
        bash scripts/install-pinned-tool.sh gitleaks osv-scanner --dest "$HOME/.local/specflow-bin"
        echo "$HOME/.local/specflow-bin" >> "$GITHUB_PATH"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}
    - name: Install gate dependencies
      shell: bash
      run: |
        pip install --require-hashes -r scripts/requirements.txt
        if [[ -f requirements.txt ]]; then
          pip install --require-hashes -r requirements.txt
        fi
