[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "__PKG__"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["__PKG__", "__PKG__.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
